charon {
    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike = 2
            knl = 2
            cfg = 2
            default = 1
            append = yes
            flush_line = yes
        }
        stderr {
            ike = 1
            knl = 1
        }
    }
}

include /etc/strongswan.d/*.conf
