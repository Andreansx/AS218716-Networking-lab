name: ipsec0
topology:
  nodes:
    r1:
      kind: linux 
      image: bird1:local
      binds:
        - bird1.conf:/etc/bird.conf
        - clab-ipsec0/authorized_keys:/root/.ssh/authorized_keys:ro
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - bird -c /etc/bird.conf
        - /usr/sbin/sshd
      
