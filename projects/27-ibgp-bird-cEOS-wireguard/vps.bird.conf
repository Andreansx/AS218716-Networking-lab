router id 10.0.255.1;
define ASN=65000;
define LO=10.0.99.1/32;
define CEOS=10.0.99.2;
log syslog all;
protocol device {
    scan time 10;
  }
protocol kernel {
	  ipv4 {
		  import none;
		  export all;
	  };
	  persist;
  }
protocol direct {
    ipv4;
    interface "eth*", "lo", "wg*";
  }
protocol static {
  ipv4;
  route 10.0.99.2/32 via 10.99.99.2;
}
protocol bgp ibgptoceos {
    local 10.0.99.1 as ASN;
    neighbor CEOS as ASN;
    ipv4 {
	    import all;
    	export all;
	  };
}
