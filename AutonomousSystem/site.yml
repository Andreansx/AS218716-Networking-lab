- name: nftables config, nginx
  hosts: edge_linux
  become: true
  tasks:
    - name: make sure nftables are installed
      ansible.builtin.apt:
        name: nftables
        state: present
    - name: generate config for nftables
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: "0755"
        validate: nft -c -f %s
      notify: Reload nftables

    - name: make sure nftables is enabled
      ansible.builtin.service:
        name: nftables
        state: started
        enabled: true

    - name: make sure nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
  handlers:
    - name: Reload nftables
      ansible.builtin.service:
        name: nftables
        state: reloaded
