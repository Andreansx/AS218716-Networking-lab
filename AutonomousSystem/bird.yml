- name: BIRD config
  hosts: edge_linux
  become: true
  tasks:
    - name: make sure bird dir exists
      ansible.builtin.file:
        path: /etc/bird/
        state: directory
        mode: "0755"
    - name: generate bird config and push to servers
      ansible.builtin.template:
        src: templates/bird.conf.j2
        dest: /etc/bird/bird.conf

    - name: get ebgp status
      ansible.builtin.command: birdc -r show protocols all ebgp_{{ item.name }}_as{{ item.remote_as }}
      loop: "{{ ebgp_peers }}"
      register: ebgp_status
      changed_when: false
    - name: file for website
      ansible.builtin.copy:
        content: |
          {% for r in ebgp_status.results %}
          {% for line in r.stdout_lines %}
          {{ line }}
          {% endfor %}

          {% endfor %}
        dest: /var/www/html/status/bgp.txt
        mode: "0644"
    - name: ReloadBIRD
      ansible.builtin.service:
        name: bird
        state: reloaded

